# Proposed Pi 4 bootloader EEPROM config for sentence boot (sudo rpi-eeprom-config --edit).
# Keys checked against raspberrypi/documentation eeprom-bootloader.adoc and the
# rpi-eeprom firmware-2711 release notes (2026-10-11). Update the EEPROM to the
# current default release first (static IP needs >= 2020-03, blksize 1468 >= 2022-10,
# TFTP block-counter rollover fix 2025-09-23).
[all]
BOOT_UART=1                 # bootloader log on GPIO14 @115200 — same wire as the node's report
BOOT_ORDER=0xf2             # network, then RESTART (loop forever)
NET_BOOT_MAX_RETRIES=0
# Static addresses: with TFTP_IP + CLIENT_IP + SUBNET set, DHCP is skipped.
# GATEWAY may be omitted on the same subnet (doc).
CLIENT_IP=10.0.0.2
SUBNET=255.255.255.0
TFTP_IP=10.0.0.1
TFTP_PREFIX=0               # requests <serial>/start4.elf first; tftpd ignores the prefix
TFTP_FILE_TIMEOUT=30000     # how long one request waits (min 5000). The hub's tftpd parks the
                            # idle request and answers it the moment a sentence is pending, so a
                            # long wait costs nothing and means fewer network restarts (each one
                            # renegotiates the Ethernet link, ~2-3 s blind).
# Boot-time trims
DISABLE_HDMI=1              # no diagnostics screen; also disables network install
NET_INSTALL_ENABLED=0       # skips USB keyboard probe (~1 s per boot, doc)
NET_INSTALL_AT_POWER_ON=0
ENABLE_SELF_UPDATE=0        # no pieeprom.sig/.upd probes over TFTP
# Real "off" (only with rt.c built -DPOKE_HALT): PM_RSTS partition 63 makes the
# bootloader halt; with these two the PMIC outputs are switched off and only a
# GLOBAL_EN short to ground boots it again (needs a hub-controlled wake line).
#WAKE_ON_GPIO=0
#POWER_OFF_ON_HALT=1
# Optional: bootloader log to the hub over UDP instead of a serial adapter
#NETCONSOLE=6665@10.0.0.2/,6666@10.0.0.1/
