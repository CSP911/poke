<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HEX — Assembly Library</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.header{padding:12px 24px;background:#161b22;border-bottom:1px solid #30363d;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:16px;color:#58a6ff}
.header h1 span{color:#8b949e;font-weight:400;font-size:12px}
.header a{color:#8b949e;text-decoration:none;font-size:12px;margin-left:16px}
.header a:hover{color:#58a6ff}

.controls{padding:12px 24px;background:#161b22;border-bottom:1px solid #30363d;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{padding:8px 18px;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-weight:600}
.btn-scan{background:#238636;color:#fff}
.btn-scan:hover{background:#2ea043}
.edge-sel{background:#0d1117;border:1px solid #30363d;color:#e6edf3;padding:6px 12px;border-radius:6px;font-size:12px}
.tag-filter{display:flex;gap:6px;margin-left:auto}
.tag-btn{padding:4px 10px;border-radius:12px;border:1px solid #30363d;background:none;color:#8b949e;font-size:10px;cursor:pointer}
.tag-btn.active{background:#1f6feb20;color:#58a6ff;border-color:#58a6ff}
.tag-btn:hover{border-color:#58a6ff}

.stats{padding:8px 24px;background:#0d1117;border-bottom:1px solid #21262d;font-size:11px;color:#8b949e;display:flex;gap:20px}
.stat-val{color:#e6edf3;font-weight:600}

.list{padding:16px 24px;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 180px);overflow-y:auto}
.list::-webkit-scrollbar{width:6px}
.list::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}

.asm-card{background:#161b22;border:1px solid #30363d;border-radius:8px;overflow:hidden;transition:border-color 0.15s}
.asm-card:hover{border-color:#58a6ff}
.asm-hdr{padding:10px 14px;display:flex;align-items:center;gap:10px;cursor:pointer}
.asm-key{font-size:13px;font-weight:700;color:#58a6ff;font-family:monospace}
.asm-desc{font-size:11px;color:#8b949e;flex:1}
.asm-tags{display:flex;gap:4px}
.asm-tag{font-size:9px;padding:2px 6px;border-radius:8px;background:#21262d;color:#8b949e}
.asm-tag.network{background:#1f6feb15;color:#58a6ff}
.asm-tag.storage{background:#23863615;color:#3fb950}
.asm-tag.display{background:#d2992215;color:#d29922}
.asm-tag.math{background:#a371f715;color:#a371f7}
.asm-tag.probe{background:#f8514915;color:#f85149}
.asm-tag.generic{background:#21262d;color:#8b949e}
.asm-uses{font-size:10px;color:#484f58;min-width:50px;text-align:right}

.asm-body{display:none;border-top:1px solid #21262d;padding:12px 14px}
.asm-card.open .asm-body{display:block}

.asm-section{margin-bottom:10px}
.asm-section h4{font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px}
.asm-code{background:#0d1117;border:1px solid #21262d;border-radius:6px;padding:10px 12px;font-family:'SF Mono',Monaco,monospace;font-size:12px;line-height:1.6;color:#e6edf3;white-space:pre;overflow-x:auto}
.asm-code .kw{color:#ff7b72}
.asm-code .reg{color:#79c0ff}
.asm-code .num{color:#a5d6ff}
.asm-code .param{color:#ffa657;font-weight:700}
.asm-code .cmt{color:#484f58}

.asm-params{display:flex;gap:8px;flex-wrap:wrap}
.asm-param{background:#0d1117;border:1px solid #21262d;border-radius:4px;padding:3px 8px;font-size:11px}
.asm-param .pk{color:#ffa657;font-weight:600}

.asm-meta{display:flex;gap:16px;font-size:10px;color:#484f58}
</style>
</head>
<body>
<div class="header">
  <h1>HEX <span>Assembly Library</span></h1>
  <div><a href="/ui">&larr; Dashboard</a><a href="/scenario">Scenario</a></div>
</div>

<div class="controls">
  <select class="edge-sel" id="edgeSel"><option value="">Select edge...</option></select>
  <button class="btn btn-scan" onclick="incubateEdge()">Incubate Edge</button>
  <div class="tag-filter" id="tagFilter"></div>
</div>

<div class="stats" id="stats">
  <span>Templates: <span class="stat-val" id="statCount">-</span></span>
  <span>Total uses: <span class="stat-val" id="statUses">-</span></span>
  <span>Tags: <span class="stat-val" id="statTags">-</span></span>
</div>

<div class="list" id="asmList"></div>

<script>
const HUB = location.origin
let allTemplates = []
let activeTag = null

fetch(HUB+'/nodes').then(r=>r.json()).then(d=>{
  const sel=document.getElementById('edgeSel')
  for(const n of d.nodes||[]){const o=document.createElement('option');o.value=n.node_id;o.textContent=n.node_id;sel.appendChild(o)}
})

function highlightAsm(code) {
  return code
    .replace(/\{\{(\w+)\}\}/g, '<span class="param">{{$1}}</span>')
    .replace(/;(.*)$/gm, '<span class="cmt">;$1</span>')
    .replace(/\b(mov|add|sub|imul|idiv|and|or|xor|shl|shr|in|out|push|pop|ret|call|nop|cmp|jmp|je|jne|jg|jl|jge|jle|movzx|lea)\b/g, '<span class="kw">$1</span>')
    .replace(/\b(eax|ebx|ecx|edx|esi|edi|esp|ebp|ax|bx|cx|dx|al|bl|cl|dl|ah|bh|ch|dh)\b/g, '<span class="reg">$1</span>')
    .replace(/\b(0x[0-9A-Fa-f]+|\d+)\b/g, '<span class="num">$1</span>')
    .replace(/^(BITS \d+)/gm, '<span class="cmt">$1</span>')
}

function renderList(templates) {
  const list = document.getElementById('asmList')
  const filtered = activeTag ? templates.filter(t => t.tags?.includes(activeTag)) : templates
  list.innerHTML = ''

  if (filtered.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:40px;color:#484f58">No templates found. Incubate an edge to discover devices.</div>'
    return
  }

  for (const t of filtered) {
    const card = document.createElement('div')
    card.className = 'asm-card'
    const tagColors = {'network':'network','storage':'storage','display':'display','math':'math','probe':'probe','generic':'generic','identify':'probe','stats':'network','read':'storage','compute':'math'}
    const tagsHtml = (t.tags||[]).map(tag => `<span class="asm-tag ${tagColors[tag]||''}">${tag}</span>`).join('')
    const paramsHtml = (t.params||[]).map(p => `<span class="asm-param"><span class="pk">{{${p}}}</span></span>`).join('')

    card.innerHTML = `
      <div class="asm-hdr" onclick="this.parentElement.classList.toggle('open')">
        <span class="asm-key">${t.key}</span>
        <span class="asm-desc">${t.desc||''}</span>
        <span class="asm-tags">${tagsHtml}</span>
        <span class="asm-uses">${t.uses||0} uses</span>
      </div>
      <div class="asm-body">
        <div class="asm-section">
          <h4>Assembly Template</h4>
          <div class="asm-code">${highlightAsm(t.template||'')}</div>
        </div>
        ${t.params?.length ? `<div class="asm-section"><h4>Parameters</h4><div class="asm-params">${paramsHtml}</div></div>` : ''}
        <div class="asm-meta">
          <span>Created: ${t.created ? new Date(t.created).toLocaleDateString() : '-'}</span>
          <span>Uses: ${t.uses||0}</span>
        </div>
      </div>`
    list.appendChild(card)
  }
}

function renderTags(templates) {
  const tags = {}
  for (const t of templates) for (const tag of t.tags||[]) tags[tag] = (tags[tag]||0) + 1
  const container = document.getElementById('tagFilter')
  container.innerHTML = '<span class="tag-btn'+(activeTag?'':' active')+'" onclick="filterTag(null)">All</span>'
  for (const [tag, count] of Object.entries(tags).sort((a,b)=>b[1]-a[1])) {
    container.innerHTML += `<span class="tag-btn${activeTag===tag?' active':''}" onclick="filterTag('${tag}')">${tag} (${count})</span>`
  }
}

function filterTag(tag) {
  activeTag = tag
  renderTags(allTemplates)
  renderList(allTemplates)
}

function updateStats(templates) {
  document.getElementById('statCount').textContent = templates.length
  document.getElementById('statUses').textContent = templates.reduce((s,t)=>s+(t.uses||0),0)
  const tags = new Set(); templates.forEach(t=>(t.tags||[]).forEach(tag=>tags.add(tag)))
  document.getElementById('statTags').textContent = tags.size
}

async function loadCache() {
  const data = await fetch(HUB+'/asmcache').then(r=>r.json())
  allTemplates = data
  updateStats(data)
  renderTags(data)
  renderList(data)
}

async function incubateEdge() {
  const id = document.getElementById('edgeSel').value
  if (!id) { alert('Select an edge'); return }
  document.getElementById('asmList').innerHTML = '<div style="text-align:center;padding:40px;color:#8b949e">Incubating... scanning PCI + running sketches...</div>'
  try {
    await fetch(HUB+'/incubate/'+id).then(r=>r.json())
    await loadCache()
  } catch(e) { alert('Error: '+e.message) }
}

loadCache()
</script>
</body>
</html>
