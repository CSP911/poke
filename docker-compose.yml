services:
  edge:
    build:
      context: .
      dockerfile: Dockerfile.edge
    ports:
      - "8080:8080"
    volumes:
      - edge-store:/poke/data
    restart: unless-stopped

  hub:
    build:
      context: .
      dockerfile: Dockerfile.hub
    ports:
      - "3333:3333"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - HUB_SECRET=${HUB_SECRET:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      - edge
    restart: unless-stopped

  # Auto-register edge with hub after startup
  setup:
    image: curlimages/curl:latest
    depends_on:
      - hub
      - edge
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for hub and edge to start..."
        sleep 5
        echo "Registering edge with hub..."
        curl -sf -X POST http://hub:3333/enroll \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer $${HUB_SECRET}" \
          -d '{"node_id":"x86-edge","endpoint":"http://edge:8080","arch":"i386","memory_mb":64}' \
          && echo " -> Edge registered!" \
          || echo " -> Registration failed (hub may need HUB_SECRET or is not ready)"
    environment:
      - HUB_SECRET=${HUB_SECRET:-}

volumes:
  edge-store:
