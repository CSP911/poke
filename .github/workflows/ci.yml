name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (asm x86 + ARM + hub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install nasm (for verification)
        run: sudo apt-get install -y nasm

      - run: npm install
      - name: Run all tests
        run: npm test

  kernel-build:
    name: x86 Kernel Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm

      - name: Build boot sector
        run: nasm -f bin -o boot.bin kernel/boot.asm

      - name: Verify boot.bin size
        run: test $(stat -c%s boot.bin) -eq 512 && echo "boot.bin OK (512 bytes)"
