name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit Tests (x86 + ARM + Hub)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install nasm
        run: sudo apt-get install -y nasm

      - run: npm install
      - name: Run all tests
        run: npm test

  kernel-build:
    name: x86 Kernel Build + QEMU Boot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc-multilib qemu-system-x86 curl

      - name: Build kernel (gcc -m32)
        run: |
          mkdir -p build
          nasm -f bin -o build/boot.bin kernel/boot.asm
          nasm -f elf32 -o build/kernel_entry.o kernel/kernel_entry.asm
          gcc -m32 -ffreestanding -nostdlib -fno-builtin -fno-stack-protector -Os \
              -Wall -Wno-unused-function -Wno-unused-variable \
              -c -o build/kernel.o kernel/kernel.c
          ld -m elf_i386 -T kernel/linker.ld -nostdlib \
              -o build/kernel.elf build/kernel_entry.o build/kernel.o
          objcopy -O binary build/kernel.elf build/kernel.bin
          cat build/boot.bin build/kernel.bin > poke.img
          dd if=/dev/zero bs=1 count=0 seek=131072 of=poke.img 2>/dev/null
          echo "poke.img: $(stat -c%s poke.img) bytes"

      - name: Boot QEMU and test
        run: |
          qemu-system-i386 \
            -drive format=raw,file=poke.img -m 64M \
            -device e1000,netdev=net0 \
            -netdev user,id=net0,hostfwd=tcp::8080-:80 \
            -display none -monitor none -nographic &

          for i in $(seq 1 20); do
            if curl -sf --max-time 3 http://localhost:8080/health > /dev/null 2>&1; then
              echo "QEMU booted after ${i}s"
              break
            fi
            sleep 1
          done

          echo "=== Health ==="
          curl -sf --max-time 5 http://localhost:8080/health

          echo ""
          echo "=== Compute 2+3 ==="
          printf '\xB8\x02\x00\x00\x00\x83\xC0\x03\xC3' | \
            curl -sf --max-time 5 http://localhost:8080/poke --data-binary @- | \
            grep -q "eax=5" && echo "eax=5 OK" || exit 1

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build hub image
        run: docker build -f Dockerfile.hub -t poke-hub .

      - name: Build edge image
        run: docker build -f Dockerfile.edge -t poke-edge .

      - name: Verify hub starts
        run: |
          docker run -d --name hub-test -p 3333:3333 poke-hub
          sleep 3
          docker logs hub-test 2>&1 | head -5
          docker stop hub-test && docker rm hub-test
