# POKE Factory Simulation — 3 production lines + hub
# Usage: docker compose -f docker-compose.factory.yml up --build

services:
  edge-line-a:
    build:
      context: .
      dockerfile: Dockerfile.edge
    ports:
      - "8081:8080"
    restart: "no"

  edge-line-b:
    build:
      context: .
      dockerfile: Dockerfile.edge
    ports:
      - "8082:8080"
    restart: "no"

  edge-line-c:
    build:
      context: .
      dockerfile: Dockerfile.edge
    ports:
      - "8083:8080"
    restart: "no"

  hub:
    build:
      context: .
      dockerfile: Dockerfile.hub
    ports:
      - "3333:3333"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - HUB_SECRET=${HUB_SECRET:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      - edge-line-a
      - edge-line-b
      - edge-line-c
    restart: unless-stopped

  setup:
    image: curlimages/curl:latest
    depends_on:
      - hub
      - edge-line-a
      - edge-line-b
      - edge-line-c
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for hub and edges..."
        sleep 8
        echo "Registering 3 production lines..."
        curl -sf -X POST http://hub:3333/enroll \
          -H "Content-Type: application/json" \
          -d '{"node_id":"line-A","endpoint":"http://edge-line-a:8080","arch":"i386","memory_mb":64,"capabilities":["compute","factory"]}'
        echo " -> Line A registered"
        curl -sf -X POST http://hub:3333/enroll \
          -H "Content-Type: application/json" \
          -d '{"node_id":"line-B","endpoint":"http://edge-line-b:8080","arch":"i386","memory_mb":64,"capabilities":["compute","factory"]}'
        echo " -> Line B registered"
        curl -sf -X POST http://hub:3333/enroll \
          -H "Content-Type: application/json" \
          -d '{"node_id":"line-C","endpoint":"http://edge-line-c:8080","arch":"i386","memory_mb":64,"capabilities":["compute","factory"]}'
        echo " -> Line C registered"
        echo "Factory ready!"
    environment:
      - HUB_SECRET=${HUB_SECRET:-}
