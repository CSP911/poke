# The vocabulary of the POKE ontology — generated by tools/ontology.py
budgets:
  kinds: 12
  entities: 400
  children_per_entity: 60
  relations_per_group: 8
  edge_note_max_lines: 6
default_kind: "topic"
kinds:
  - id: "topic"
    desc: "a place that only groups what is under it"
  - id: "protocol"
    desc: "a wire or memory contract both sides must honour — commands, syscalls, a struct layout"
  - id: "platform-rule"
    desc: "a rule about the kernel or the platform itself — what it must and must not do"
  - id: "driver"
    desc: "a library resident: an injected binary that owns one piece of hardware"
  - id: "device"
    desc: "a chip or board — what it is, its addresses and registers"
  - id: "recipe"
    desc: "how to recognise a part on a bus and read its main value"
  - id: "lesson"
    desc: "something learned the hard way while bringing hardware up — a trap and its fix"
  - id: "skill"
    desc: "a generated movement program for one body and intent, with its tuned params"
  - id: "procedure"
    desc: "an ordered way of doing something on the hub side"
relations:
  - group: "hardware"
    rels:
      - id: "DRIVEN_BY"
        template: "{from} is driven by {to}"
        inverse: "{to} drives {from}"
        desc: "which resident owns this device"
      - id: "USES_BUS"
        template: "{from} uses the bus {to}"
        inverse: "{to} carries {from}"
        desc: "which bus service a driver depends on"
      - id: "FOUND_ON"
        template: "{from} was found on {to}"
        inverse: "{to} has {from} attached"
        desc: "where a device answered"
  - group: "provenance"
    rels:
      - id: "VERIFIED_ON"
        template: "{from} was verified on {to}"
        inverse: "{to} verified {from}"
        desc: "twin or hardware"
      - id: "LEARNED_FROM"
        template: "{from} was learned from {to}"
        inverse: "{to} taught {from}"
        desc: "where a lesson came from"
      - id: "TWIN_OF"
        template: "{from} is the twin of {to}"
        inverse: "{to} has the twin {from}"
        desc: "virtual stand-in"
  - group: "motion"
    rels:
      - id: "SPEAKS"
        template: "{from} speaks {to}"
        inverse: "{to} is spoken by {from}"
        desc: "which ABI a skill is written against"
edge_rules: []
